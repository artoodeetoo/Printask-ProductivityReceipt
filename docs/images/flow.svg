<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>How Printask works</title>
  <desc>Notion tasks and Slack messages are fetched by Printask on a NAS, checked against a local history, judged by Claude, drawn as a card and sent to a receipt printer.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect width="1000" height="470" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- sources -->
  <rect x="30" y="64" width="170" height="86" rx="10" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="115" y="100" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2328">Notion</text>
  <text x="115" y="124" text-anchor="middle" font-size="13" fill="#57606a">To Do tasks</text>
  <rect x="30" y="204" width="170" height="86" rx="10" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="115" y="240" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2328">Slack</text>
  <text x="115" y="264" text-anchor="middle" font-size="13" fill="#57606a">ticket bots, channels</text>
  <path d="M200 107 H262" stroke="#57606a" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M200 247 H262" stroke="#57606a" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- container -->
  <rect x="264" y="30" width="472" height="352" rx="12" fill="#ddf4ff" fill-opacity="0.45" stroke="#0969da" stroke-width="2"/>
  <text x="500" y="54" text-anchor="middle" font-size="14" font-weight="600" fill="#0969da">Printask · one container on your NAS or PC</text>

  <g font-size="13">
    <rect x="290" y="72" width="420" height="58" rx="8" fill="#ffffff" stroke="#8c959f"/>
    <text x="306" y="96" font-size="15" font-weight="600" fill="#1f2328">1  Poll</text>
    <text x="306" y="116" fill="#57606a">fetch new tasks from each source on a timer</text>

    <rect x="290" y="148" width="420" height="58" rx="8" fill="#ffffff" stroke="#8c959f"/>
    <text x="306" y="172" font-size="15" font-weight="600" fill="#1f2328">2  Seen it?</text>
    <text x="306" y="192" fill="#57606a">local SQLite history: skip repeats and duplicate titles</text>

    <rect x="290" y="224" width="420" height="58" rx="8" fill="#ffffff" stroke="#8c959f"/>
    <text x="306" y="248" font-size="15" font-weight="600" fill="#1f2328">3  Ask Claude</text>
    <text x="306" y="268" fill="#57606a">is it a task? how urgent? &#8594; HIGH / MEDIUM / LOW</text>

    <rect x="290" y="300" width="420" height="58" rx="8" fill="#ffffff" stroke="#8c959f"/>
    <text x="306" y="324" font-size="15" font-weight="600" fill="#1f2328">4  Draw the card</text>
    <text x="306" y="344" fill="#57606a">priority dots · category · title · due date · QR code</text>
  </g>
  <path d="M500 130 V146" stroke="#57606a" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M500 206 V222" stroke="#57606a" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M500 282 V298" stroke="#57606a" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- Claude -->
  <rect x="800" y="188" width="170" height="86" rx="10" fill="#fff8c5" stroke="#bf8700"/>
  <text x="885" y="224" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2328">Claude</text>
  <text x="885" y="248" text-anchor="middle" font-size="13" fill="#57606a">Anthropic API</text>
  <path d="M710 253 H796" stroke="#57606a" stroke-width="2" fill="none" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- printer -->
  <rect x="800" y="296" width="170" height="86" rx="10" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="885" y="330" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2328">Receipt printer</text>
  <text x="885" y="354" text-anchor="middle" font-size="13" fill="#57606a">ESC/POS · port 9100</text>
  <path d="M710 329 H796" stroke="#57606a" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- optional write back -->
  <path d="M264 136 H206" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
  <text x="115" y="176" text-anchor="middle" font-size="12" fill="#57606a">dashed: optional write-back</text>
  <text x="115" y="192" text-anchor="middle" font-size="12" fill="#57606a">of Claude's priority</text>

  <!-- web ui -->
  <rect x="264" y="404" width="472" height="46" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-dasharray="6 4"/>
  <text x="500" y="424" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Web UI on your home network (password protected)</text>
  <text x="500" y="442" text-anchor="middle" font-size="12" fill="#57606a">status · tasks · settings · poll now · test print · clear history</text>
  <path d="M500 404 V384" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
</svg>
